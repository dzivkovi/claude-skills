# Gemini CLI policy for gemini_review.py repo mode (loaded with --policy, user tier).
#
# An allow-list, not a single deny. Settings-driven ALLOW rules (tools.allowed,
# trusted MCP servers) load at user tier priority 1 to 300 and beat plan mode's
# own catch-all deny, so every rule here sits above 300.
#
# Why grep_search is not allowed: in Gemini CLI 0.35.2 it read gitignored files
# that read_file refused (canary, 2026-11-11). Why the argsPattern denies: glob and
# list_directory accept a model-supplied respect_git_ignore=false that returns the
# NAMES of ignored files.

[[rule]]
decision = "deny"
priority = 900
deny_message = "gemini_review repo mode allows read_file, list_directory and glob only."

[[rule]]
toolName = ["read_file", "list_directory", "glob"]
decision = "allow"
priority = 950

[[rule]]
toolName = ["glob", "list_directory"]
argsPattern = '"respect_git_ignore":false'
decision = "deny"
priority = 999
deny_message = "gemini_review repo mode keeps .gitignore filtering on."

[[rule]]
toolName = ["glob", "list_directory"]
argsPattern = '"respect_gemini_ignore":false'
decision = "deny"
priority = 999
deny_message = "gemini_review repo mode keeps .geminiignore filtering on."

# Windows: the CLI's ignore check compares paths case-sensitively against the
# project root (C:\...), so a lowercase drive letter (c:\...) skipped it.
[[rule]]
toolName = "read_file"
argsPattern = '"file_path":"[a-z]:'
decision = "deny"
priority = 999
deny_message = "Use a path relative to the repository root."

# The CLI also allows its own project temp folder, which holds transcripts of
# earlier interactive sessions.
[[rule]]
toolName = ["read_file", "list_directory", "glob"]
argsPattern = '\.gemini[\\/]+tmp'
decision = "deny"
priority = 999
deny_message = "The Gemini CLI temp folder is out of scope."
